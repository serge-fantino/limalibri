[tool.poetry]
# Une application, pas une bibliothèque : on ne construit rien à installer.
package-mode = false

[project]
name = "limalibri"
version = "0.1.0"
description = "LimaLibri — la lime du livre : un atelier d'écriture de livres (serveur + front), sur un dossier de livre."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn (>=0.30,<1.0)",
    "pyyaml (>=6.0,<7.0)",
    "markdown (>=3.6,<4.0)",
    "ruamel-yaml (>=0.18,<1.0)",
    "claude-agent-sdk (>=0.2,<1.0)",
    "networkx (>=3.4,<3.5)",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
