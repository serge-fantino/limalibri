<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LimaLibri</title>
<link rel="stylesheet" href="limalibri.css">
<script>try {   // les réglages d'avant le nom LimaLibri (« atelier-… ») passent sous le nouveau nom, une fois
  for (const k of Object.keys(localStorage)) if (k.startsWith("atelier-")) {
    const n = "limalibri-" + k.slice(8); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)); localStorage.removeItem(k); }
} catch (e) {}
try { document.documentElement.dataset.theme = localStorage.getItem("limalibri-theme") || "auto"; } catch (e) {}</script>
</head>
<body>
<header id="barre">
  <strong>LimaLibri</strong> <span class="mut" id="titre-livre"></span>
  <nav id="versions">
    <button id="b-livre" title="Le livre : présentation, versions, garde-fous, réglages de Claude">Livre</button>
    <button id="b-plan" title="Le plan et le synopsis : le livre, ses parties, ses chapitres">Plan</button>
    <button data-v="recit" class="actif">Récit</button>
    <button data-v="essai">Essai</button>
    <button id="b-fiches" title="Les fiches scientifiques : la base de connaissance du livre">Fiches</button>
    <span class="sep"></span>
    <button id="b-annotations" title="Tes annotations : la liste, par chapitre">✎ Annotations</button>
    <button id="b-demandes" title="Le travail confié à Claude : réécritures et recherches">↻ Demandes</button>
    <button id="b-rafraichir" title="Rafraîchir : relire le livre (textes, plan, statuts) et redessiner la vue, à la même place">⟳</button>
    <button id="b-theme" title="Thème">◐</button>
    <button id="b-claude" title="Parler du livre avec Claude : il lit tout, répond, et propose du travail à lancer">✦ Claude</button>
  </nav>
</header>
<div id="cadre">
  <aside id="gauche">
    <section class="volet" id="volet-livre">
      <button class="volet-titre" data-volet="livre">Plan du livre</button>
      <nav id="sommaire"></nav>
    </section>
    <section class="volet" id="volet-chapitre" hidden>
      <button class="volet-titre" data-volet="chapitre">Chapitre</button>
      <section id="plan-col"></section>
    </section>
  </aside>
  <div id="centre">
    <nav id="outils" hidden></nav>
    <div id="defile"><main id="page"><p class="mut">Choisir un chapitre.</p></main></div>
  </div>
  <aside id="droite">
    <div id="fiche"></div>
  </aside>
</div>
<aside id="tiroir" hidden></aside>
<aside id="dialogue" hidden></aside>
<script type="module" src="limalibri.js"></script>
</body>
</html>
