<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier</title>
<link rel="stylesheet" href="atelier.css">
</head>
<body>
<header id="barre">
  <strong>Atelier</strong> <span class="mut" id="titre-livre"></span>
  <nav id="versions">
    <button data-v="recit" class="actif">Récit</button>
    <button data-v="essai">Essai</button>
    <button id="b-fiches" title="Les fiches scientifiques : la base de connaissance du livre">Fiches</button>
    <span class="sep"></span>
    <button id="b-annotations" title="Tes annotations : la liste, par chapitre">✎ Annotations</button>
    <button id="b-demandes" title="Le travail confié à Claude : réécritures et recherches">↻ Demandes</button>
  </nav>
</header>
<div id="cadre">
  <aside id="gauche">
    <section class="volet" id="volet-livre">
      <button class="volet-titre" data-volet="livre">Plan du livre</button>
      <nav id="sommaire"></nav>
    </section>
    <section class="volet" id="volet-chapitre" hidden>
      <button class="volet-titre" data-volet="chapitre">Chapitre</button>
      <section id="plan-col"></section>
    </section>
  </aside>
  <div id="centre">
    <nav id="outils" hidden></nav>
    <div id="defile"><main id="page"><p class="mut">Choisir un chapitre.</p></main></div>
  </div>
  <aside id="droite">
    <div id="fiche"></div>
  </aside>
</div>
<aside id="tiroir" hidden></aside>
<script type="module" src="atelier.js"></script>
</body>
</html>
